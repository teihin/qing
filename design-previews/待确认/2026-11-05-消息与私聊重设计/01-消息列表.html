<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>消息列表</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="bg"></div>

  <div class="appbar">
    <div class="title gold">消息</div>
    <div class="host-chip"><span class="dot"></span>聊天托管：已开启</div>
  </div>

  <div class="section-head"><i></i>最近会话<em>共 2 个</em></div>

  <section class="list-card">
    <div class="row unread">
      <div class="avatar"><img src="assets/avatar-a.png" alt=""><span class="badge">3</span></div>
      <div class="conv">
        <div class="line1">
          <span class="name">a3</span>
          <span class="club">A3俱乐部</span>
          <span class="role">群主</span>
          <span class="time">13:01</span>
        </div>
        <div class="line2">
          <span class="preview">234234</span>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="avatar"><img src="assets/avatar-b.png" alt=""></div>
      <div class="conv">
        <div class="line1">
          <span class="name">a2</span>
          <span class="club">A1俱乐部</span>
          <span class="time">13:55</span>
        </div>
        <div class="line2">
          <span class="preview">玩家 a2 上分 100 成功（客服托管…</span>
        </div>
      </div>
    </div>
  </section>

  <div class="empty">
    <div class="halo"><div class="spade">♠</div></div>
    <p>暂无更多会话</p>
    <small>下拉可刷新</small>
  </div>
</div>
</body>
</html>
