<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>私聊详情</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="bg"></div>

  <header class="chatbar">
    <div class="icon-btn">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <path d="M15 4.5 7.5 12 15 19.5" stroke="#F6CE84" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="chat-title"><span class="gold">a2</span><span class="sep"></span><span class="gold" style="opacity:.92">玩家</span></div>
    <div class="icon-btn">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
        <path d="M4 7h16M9.5 7V5.4c0-.8.6-1.4 1.4-1.4h2.2c.8 0 1.4.6 1.4 1.4V7M6.5 7l.8 12.1c.1 1 .9 1.9 2 1.9h5.4c1.1 0 1.9-.9 2-1.9L17.5 7" stroke="#F6CE84" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M10 11v6M14 11v6" stroke="#F6CE84" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </div>
  </header>

  <main class="msgs">
    <div class="hint">没有更多消息</div>

    <div class="group left">
      <div class="stack">
        <div class="bubble l">666</div>
      </div>
      <img class="mavatar" src="assets/avatar-a.png" alt="">
    </div>

    <div class="group right">
      <img class="mavatar" src="assets/avatar-b.png" alt="">
      <div class="stack">
        <div class="bubble r">123123</div>
      </div>
    </div>

    <div class="group left">
      <div class="stack">
        <div class="bubble l">3232323</div>
        <div class="bubble l">5555</div>
      </div>
      <img class="mavatar" src="assets/avatar-a.png" alt="">
    </div>

    <div class="group right">
      <img class="mavatar" src="assets/avatar-b.png" alt="">
      <div class="stack">
        <div class="bubble r">123123</div>
        <div class="bubble r">3343234</div>
      </div>
    </div>

    <div class="group left">
      <div class="stack">
        <div class="bubble l">4444</div>
      </div>
      <img class="mavatar" src="assets/avatar-a.png" alt="">
    </div>

    <div class="timestamp">13:18</div>

    <div class="group right">
      <img class="mavatar" src="assets/avatar-b.png" alt="">
      <div class="stack">
        <div class="bubble r">888</div>
        <div class="bubble r">999</div>
        <div class="bubble r">99999</div>
        <div class="bubble r">5675674567</div>
      </div>
    </div>

    <div class="system">
      <div class="st">2026-11-05 13:55:03</div>
      <div class="sc">玩家 <b>a2</b> 上分 <b>100</b> 成功（客服托管）</div>
    </div>
  </main>

  <div class="dock">
    <div class="input-row">
      <div class="mic">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="2.6" width="6" height="11.2" rx="3" stroke="#F3C46B" stroke-width="1.9"/>
          <path d="M5.4 11.4a6.6 6.6 0 0 0 13.2 0" stroke="#F3C46B" stroke-width="1.9" stroke-linecap="round"/>
          <path d="M12 18v3.2M9 21.2h6" stroke="#F3C46B" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="field">输入消息...</div>
      <div class="send">发送</div>
    </div>

    <div class="actions">
      <div class="tile">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
          <rect x="2.8" y="6.4" width="18.4" height="13.2" rx="2.8" stroke="#F3C46B" stroke-width="1.8"/>
          <path d="M8.6 6.4 10 4.2h4l1.4 2.2" stroke="#F3C46B" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="12" cy="13" r="3.4" stroke="#F3C46B" stroke-width="1.8"/>
        </svg>
        <span>拍照上传</span>
      </div>
      <div class="tile">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="4.4" width="18" height="15.2" rx="2.6" stroke="#F3C46B" stroke-width="1.8"/>
          <circle cx="8.4" cy="9.6" r="1.7" stroke="#F3C46B" stroke-width="1.6"/>
          <path d="M4.2 17.4 9.6 12l3.4 3.6 2.6-2.2 4 4" stroke="#F3C46B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>发送图片</span>
      </div>
      <div class="tile">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
          <path d="M3.6 8.6h16.8v10.2c0 .9-.7 1.6-1.6 1.6H5.2c-.9 0-1.6-.7-1.6-1.6V8.6Z" stroke="#F3C46B" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M2.6 6.2c0-.8.6-1.4 1.4-1.4h16c.8 0 1.4.6 1.4 1.4v2.4H2.6V6.2Z" stroke="#F3C46B" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M12 4.8v15.6M12 4.8c-1.6-1.9-4.5-1.9-4.9.4-.3 1.6 1.2 2.4 4.9 1.6M12 4.8c1.6-1.9 4.5-1.9 4.9.4.3 1.6-1.2 2.4-4.9 1.6" stroke="#F3C46B" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>赠送积分</span>
      </div>
      <div class="tile">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
          <path d="M8.4 5.6v12.8M8.4 5.6 5.2 9M8.4 5.6 11.6 9" stroke="#F3C46B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15.6 18.4V5.6M15.6 18.4 12.4 15M15.6 18.4 18.8 15" stroke="#F3C46B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>上下分</span>
      </div>
      <div class="tile">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
          <rect x="4.4" y="4.6" width="15.2" height="12" rx="4" stroke="#F3C46B" stroke-width="1.8"/>
          <path d="M7.6 16.6 7.6 20.2 11.4 16.6" stroke="#F3C46B" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9.9 8.6 14.1 12.8M14.1 8.6 9.9 12.8" stroke="#F3C46B" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>清除聊天</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
